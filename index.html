<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2C4A3B">
<title>Novocura — Homeopati, Edinburgh</title>
<meta name="description" content="Novocura, Edinburgh'da butik bir homeopati uygulamasıdır. Acele ettirilmeyen görüşmeler, titiz vaka çalışması ve dinleme üzerine kurulu bir pratik.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Montserrat:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#2C4A3B; --forest-deep:#1B2E23; --parchment:#F6F1E7;
    --sand:#EAE2D0; --brass:#B08D57; --sage:#C7D0BE; --ink:#3A4A40; --ink-soft:#6B7B6F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--parchment);color:var(--ink);font-family:'Montserrat',sans-serif;font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--sage);color:var(--forest-deep)}
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--forest-deep)}
  .kicker{font-size:11px;letter-spacing:4px;color:var(--brass);text-transform:uppercase;font-weight:400}
  .hairline{width:64px;height:1px;background:var(--brass);opacity:.7}
  /* ————— header ————— */
  header{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;
    padding:22px 5vw;transition:background .4s ease, box-shadow .4s ease}
  header.scrolled{background:rgba(246,241,231,.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(44,74,59,.08)}
  header.scrolled.on-dark{background:rgba(27,46,35,.9);box-shadow:0 1px 0 rgba(246,241,231,.12)}
  .wordmark{display:flex;line-height:0}
  .wordmark img{height:42px;width:auto;display:block}
  .wordmark .logo-light{display:none}
  nav{display:flex;gap:34px;align-items:center}
  nav a{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink);text-decoration:none;font-weight:400;position:relative}
  nav a::after{content:"";position:absolute;left:0;bottom:-5px;width:0;height:1px;background:var(--brass);transition:width .35s ease}
  nav a:hover::after{width:100%}
  nav a.book{color:var(--brass)}
  nav a.lang-switch{border:1px solid rgba(176,141,87,.55);border-radius:999px;padding:5px 12px 4px;color:var(--brass)}
  nav a.lang-switch::after{display:none}
  header.on-dark .wordmark .logo-dark{display:none}
  header.on-dark .wordmark .logo-light{display:block}
  header.on-dark nav a{color:rgba(246,241,231,.75)}
  header.on-dark nav a.book{color:var(--brass)}
  @media (max-width:720px){
    nav a:not(.book):not(.lang-switch){display:none}
    .wordmark img{height:34px}
    header{gap:26px}
    nav{gap:20px;flex:0 0 auto}
  }
  /* ————— hero ————— */
  .hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
    padding:0 6vw;position:relative}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 45% at 50% 42%, rgba(199,208,190,.35), transparent 70%)}
  .hero .kicker{margin-bottom:34px}
  .hero h1{font-size:clamp(40px,6.2vw,76px);line-height:1.14;max-width:12em;font-weight:500}
  .hero h1 em{font-style:italic;color:var(--forest)}
  .hero .sub{margin-top:30px;font-size:14.5px;letter-spacing:.5px;color:var(--ink-soft);max-width:34em;line-height:1.9}
  .hero .hint{position:absolute;bottom:5vh;font-size:11px;letter-spacing:2px;color:#93A295;animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.3}50%{opacity:.85}}
  /* ————— editorial sections ————— */
  section.block{padding:16vh 6vw}
  .narrow{max-width:660px;margin:0 auto}
  .narrow .kicker{display:block;margin-bottom:26px}
  .narrow h2{font-size:clamp(30px,3.6vw,44px);line-height:1.2;margin-bottom:34px}
  .narrow p{font-size:15.5px;line-height:2.05;margin-bottom:1.4em;color:var(--ink)}
  .narrow p.lede::first-letter{font-family:'Cormorant Garamond',serif;font-size:3.2em;float:left;line-height:.82;
    padding:6px 12px 0 0;color:var(--brass)}
  .narrow .pull{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,2.3vw,26px);
    line-height:1.5;color:var(--forest);margin:2em 0;padding-left:1.4em;border-left:1px solid var(--brass)}
  /* ————— about ————— */
  .about{background:var(--sand)}
  .about .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:5fr 6fr;gap:7vw;align-items:center}
  .about figure{overflow:hidden}
  .about img{width:100%;height:auto;display:block;transform:scale(1.06)}
  .about figcaption{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-top:14px}
  .about h2{font-size:clamp(30px,3.4vw,42px);line-height:1.2;margin:22px 0 26px}
  .about p{font-size:15px;line-height:2;margin-bottom:1.3em}
  .about .sig{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:var(--forest);margin-top:10px}
  .story-link{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--brass);text-decoration:none;border-bottom:1px solid var(--brass);padding-bottom:4px;font-weight:400;transition:opacity .3s}
  .story-link:hover{opacity:.65}
  .about .creds{list-style:none;margin-top:28px;padding-top:22px;border-top:1px solid rgba(44,74,59,.16)}
  .about .creds li{font-size:12px;line-height:1.9;letter-spacing:.4px;color:var(--ink-soft);padding-left:18px;position:relative;margin-bottom:6px}
  .about .creds li::before{content:"";position:absolute;left:0;top:12px;width:8px;height:1px;background:var(--brass)}
  @media (max-width:820px){ .about .grid{grid-template-columns:1fr;gap:44px} }
  /* ————— teaching ————— */
  .teaching{background:var(--parchment)}
  .teaching .wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:6fr 5fr;gap:7vw;align-items:start}
  .teaching h2{font-size:clamp(30px,3.4vw,42px);line-height:1.2;margin:22px 0 26px}
  .teaching p{font-size:15px;line-height:2;margin-bottom:1.3em}
  .teach-item{border-top:1px solid var(--sand);padding:26px 0 22px}
  .teach-item:last-of-type{border-bottom:1px solid var(--sand)}
  .teach-item .t{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:3px;color:var(--brass);margin-bottom:12px;text-transform:uppercase}
  .teach-item h3{font-size:22px;margin-bottom:10px;line-height:1.3}
  .teach-item p{font-size:13.5px;line-height:1.85;color:var(--ink-soft);margin-bottom:0}
  .teaching .cohort-note{margin-top:30px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--forest);line-height:1.55}
  .teaching .cohort-note a{color:var(--brass);text-decoration:none;border-bottom:1px solid var(--brass);padding-bottom:2px}
  @media (max-width:820px){ .teaching .wrap{grid-template-columns:1fr;gap:44px} }
  /* ————— letters ————— */
  .letters{background:var(--sand)}
  .letters .inner{max-width:580px;margin:0 auto;text-align:center}
  .letters h2{font-size:clamp(28px,3.2vw,40px);margin:22px 0 20px}
  .letters .sub{font-size:14.5px;line-height:1.95;color:var(--ink-soft);margin-bottom:44px}
  .letters form{display:flex;gap:0;max-width:440px;margin:0 auto;border-bottom:1px solid var(--forest)}
  .letters input{flex:1;background:transparent;border:none;outline:none;font-family:'Montserrat',sans-serif;font-weight:300;font-size:14px;color:var(--ink);padding:12px 4px;letter-spacing:.5px}
  .letters input::placeholder{color:#93A295}
  .letters button{background:transparent;border:none;cursor:pointer;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--brass);font-weight:400;padding:12px 4px;transition:opacity .3s}
  .letters button:hover{opacity:.65}
  .letters .smallprint{margin-top:22px;font-size:11px;line-height:1.8;color:#93A295;letter-spacing:.4px}
  /* ————— the pinned illustrated consultation ————— */
  .stage-intro{height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:28px;padding:0 6vw}
  .stage-intro h2{font-size:clamp(32px,4.4vw,54px);line-height:1.16;max-width:15em}
  .stage-intro .hint{font-size:11px;letter-spacing:2px;color:#93A295;animation:breathe 3.4s ease-in-out infinite}
  .stage-section{position:relative;background:var(--parchment)}
  /* — static layout (default; also what the editor sees): a calm vertical stack — */
  .stage-pin{position:relative;max-width:860px;margin:0 auto;padding:10vh 6vw 12vh;display:flex;flex-direction:column;gap:60px}
  svg.journey-path{display:none}
  .jstep{display:flex;align-items:flex-start;gap:24px}
  .jtext{flex:1;min-width:0}
  .progress,.progress-label{display:none}
  /* — pinned animated layout (applies only when the animation layer is active) — */
  body.anim .stage-pin{height:100vh;max-width:none;margin:0;padding:0;display:block;overflow:hidden}
  body.anim svg.journey-path{display:block;position:absolute;inset:0;width:100%;height:100%}
  svg.journey-path path{fill:none;stroke:var(--forest);stroke-width:1.6;stroke-linecap:round;opacity:.5}
  /* — numbered stations — */
  body.anim .jstep{display:block;position:absolute;transform:translate(-50%,-50%);z-index:2}
  .jbadge{width:76px;height:76px;border-radius:50%;background:var(--brass);flex:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(44,74,59,.18)}
  body.anim .jbadge{opacity:0}
  .jbadge span{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:36px;
    color:var(--parchment);line-height:1;padding-top:3px;font-variant-numeric:lining-nums}
  body.anim .jtext{position:absolute;top:50%;transform:translateY(-50%);width:215px;flex:none;opacity:0}
  body.anim .jstep.tx-r .jtext{left:calc(100% + 30px)}
  body.anim .jstep.tx-l .jtext{right:calc(100% + 30px);text-align:right}
  .jtext .num{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:3px;color:var(--brass);
    margin-bottom:10px;font-variant-numeric:lining-nums}
  .jtext h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(21px,1.9vw,27px);
    color:var(--forest-deep);margin-bottom:12px;line-height:1.18}
  .jtext p{font-size:13px;line-height:1.8;color:var(--ink)}
  /* — station placement (mirrors the path's serpentine) — */
  body.anim .js1{left:38%;top:19%} body.anim .js2{left:62%;top:40%} body.anim .js3{left:38%;top:61%} body.anim .js4{left:62%;top:82%}
  body.anim .js1 .jtext{top:calc(50% + 22px)}
  body.anim .js4 .jtext{top:calc(50% - 22px)}
  body.anim .progress{display:block;position:absolute;left:6vw;bottom:8vh;width:180px;height:1px;background:var(--sand)}
  .progress .bar{height:100%;width:0%;background:var(--brass)}
  body.anim .progress-label{display:block;position:absolute;left:6vw;bottom:calc(8vh + 12px);font-size:10px;letter-spacing:3px;color:#8A988C;text-transform:uppercase}
  @media (max-width:820px){
    body.anim .js1{left:26%;top:16%} body.anim .js2{left:26%;top:38%} body.anim .js3{left:26%;top:61%} body.anim .js4{left:26%;top:84%}
    body.anim .jstep.js1 .jtext{top:calc(50% + 30px)}
    body.anim .jstep.js4 .jtext{top:calc(50% - 20px)}
    .jbadge{width:56px;height:56px}
    .jbadge span{font-size:26px}
    body.anim .jstep.tx-r .jtext,body.anim .jstep.tx-l .jtext{left:calc(100% + 18px);right:auto;top:50%;transform:translateY(-50%);width:56vw;text-align:left}
    .jtext h3{font-size:19px;margin-bottom:7px}
    .jtext p{font-size:11.5px;line-height:1.65}
    .jtext .num{font-size:12px;margin-bottom:6px}
    body.anim .progress-label{display:none}
    body.anim .progress{left:5vw;bottom:6vh}
  }
/* ————— practical ————— */
  .practical .wrap{max-width:1100px;margin:0 auto}
  .practical h2{font-size:clamp(28px,3.2vw,40px);margin:22px 0 60px}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
  .fact{padding:0 44px;border-left:1px solid var(--sand)}
  .fact:first-child{border-left:none;padding-left:0}
  .fact .n{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:3px;color:var(--brass);margin-bottom:16px}
  .fact h3{font-size:23px;margin-bottom:14px;line-height:1.25}
  .fact p{font-size:13.5px;line-height:1.9;color:var(--ink-soft)}
  @media (max-width:820px){ .facts{grid-template-columns:1fr;gap:44px} .fact{border-left:none;padding:0} }
  /* ————— journal ————— */
  .journal{background:var(--forest-deep);color:var(--parchment)}
  .journal .wrap{max-width:1100px;margin:0 auto}
  .journal .kicker{color:var(--sage)}
  .journal h2{color:var(--parchment);font-size:clamp(28px,3.2vw,40px);margin:22px 0 14px}
  .journal .note{font-size:13px;color:var(--sage);letter-spacing:1px;margin-bottom:56px}
  .entries{display:block;max-width:760px}
  .entry{border-top:1px solid rgba(246,241,231,.22);padding:22px 0 20px;transition:border-color .35s ease}
  .entries .group-note{font-size:10px;letter-spacing:2.5px;color:var(--sage);text-transform:uppercase;margin:48px 0 6px}
    .entries a.entry{display:block;text-decoration:none;color:inherit}
    .entries a.entry:hover{border-color:var(--brass)}
    .entry .read-more{display:inline-block;margin-top:14px;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2px;color:var(--brass);text-transform:uppercase}
  .entry .lang{font-size:10px;letter-spacing:2.5px;color:var(--brass);text-transform:uppercase;margin-bottom:14px}
  .entry h3{color:var(--parchment);font-size:20px;line-height:1.35;margin-bottom:8px;font-weight:500}
  .entry p{font-size:13px;line-height:1.85;color:rgba(246,241,231,.62);max-width:62ch}
  /* ————— closing ————— */
  .closing{min-height:86vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:30px;padding:0 8vw}
  .closing p{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,3vw,36px);color:var(--forest-deep);max-width:20em;line-height:1.42;font-style:italic}
  .cta{font-size:12px;letter-spacing:2.5px;color:var(--brass);text-decoration:none;text-transform:uppercase;
    border-bottom:1px solid var(--brass);padding-bottom:5px;font-weight:400;transition:opacity .3s}
  .cta:hover{opacity:.65}
  /* ————— footer ————— */
  footer{padding:56px 5vw 40px;border-top:1px solid var(--sand);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
  footer .flogo{height:44px;width:auto;display:block}
  footer small{display:block;max-width:46em;font-size:10.5px;line-height:1.8;color:#93A295;margin-top:12px}
  footer .links{display:flex;gap:26px}
  footer .links a{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);text-decoration:none}
  footer .links a:hover{color:var(--brass)}
  .intro-note{padding:12vh 6vw 6vh}
  .hl{background:linear-gradient(transparent 58%, rgba(176,141,87,.32) 58%, rgba(176,141,87,.32) 96%, transparent 96%);padding:0 .12em}
  .about .name-title{margin-bottom:34px}
  .about .creds-inline{font-size:.52em;color:var(--brass);font-weight:400;letter-spacing:.04em;white-space:nowrap}
  .intro-note .note-inner{max-width:44em;margin:0 auto;padding-left:1.3em;border-left:1px solid var(--brass)}
  .intro-note p{font-family:'Cormorant Garamond',serif;font-size:clamp(18px,1.9vw,23px);line-height:1.8;color:var(--forest-deep);margin-bottom:1.3em}
  .intro-note p:last-child{margin-bottom:0}
  .intro-note strong{font-weight:600}
  .intro-note em{font-style:italic;color:var(--forest)}
  .about .pull{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(19px,2vw,24px);line-height:1.5;color:var(--forest);margin:1.7em 0;padding-left:1.2em;border-left:1px solid var(--brass)}
  .about .strip-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--brass);margin-top:70px;margin-bottom:28px}
  .about .creds-list{max-width:680px;margin-top:-6px;margin-bottom:36px}
  .about .creds-item{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:10px 2px;border-top:1px solid rgba(44,74,59,.16)}
  .about .creds-item:last-child{border-bottom:1px solid rgba(44,74,59,.16)}
  .about .creds-item .inst{font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--forest);font-weight:600}
  .about .creds-item .qual{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--brass);white-space:nowrap;text-align:right}
  @media (max-width:720px){.about .creds-item{flex-direction:column;gap:1px;padding:9px 2px}.about .creds-item .qual{font-size:15px;text-align:left}}
  .about .logo-strip{display:flex;justify-content:flex-start;align-items:center;gap:48px;flex-wrap:wrap}
  .about .logo-strip a{display:inline-flex;line-height:0;transition:opacity .35s ease}
  .about .logo-strip img{height:42px;width:auto;display:block;filter:grayscale(1);opacity:.62;transition:filter .45s ease,opacity .45s ease}
  .about .logo-strip a:hover img{filter:grayscale(0);opacity:1}
  .about .strip-note{margin-top:22px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#93A295}
  @media (max-width:720px){.about .logo-strip{gap:30px}.about .logo-strip img{height:34px}}
  /* ——— mobil taslak: hızlı gezinme + katlanabilir bölümler ——— */
  .m-quicknav{display:none}
  .m-readmore{display:none}
  @media (max-width:720px){
    .m-quicknav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 6vw 2px}
    .m-quicknav a{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;text-align:center;color:var(--forest);text-decoration:none;border:1px solid rgba(44,74,59,.35);border-radius:999px;padding:9px 6px 8px}
    .m-readmore{display:inline-block;margin-top:14px;background:none;border:none;border-bottom:1px solid var(--brass);color:var(--brass);font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;padding:0 0 3px;cursor:pointer}
    .note-inner:not(.open) p:nth-of-type(2),.note-inner:not(.open) p:nth-of-type(3){display:none}
    .about .grid>div[data-collapsible]:not(.open) p:nth-of-type(n+2),.about .grid>div[data-collapsible]:not(.open) .sig{display:none}
    [data-collapsible]:not(.open)>.m-hide,[data-collapsible]:not(.open) .m-hide{display:none}
    .teaching .m-readmore{justify-self:start}
    .note-inner .intro-link{margin-top:22px}
    .journal .cta{letter-spacing:1.5px;padding:15px 26px 13px}
    .hint{display:none}
  }
  body.anim .reveal{opacity:0}
  /* ——— Faz 1 mobil: hamburger menü, 16px taban, güvenli alanlar, azaltılmış hareket ——— */
  .hamburger{display:none;width:44px;height:44px;flex-direction:column;justify-content:center;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:10px;z-index:70;-webkit-tap-highlight-color:transparent}
  .hamburger span{display:block;width:24px;height:2px;background:var(--ink);transition:transform .3s ease,opacity .3s ease,background .3s ease}
  .hamburger[aria-expanded="true"] span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
  .hamburger[aria-expanded="true"] span:nth-child(2){opacity:0}
  .hamburger[aria-expanded="true"] span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
  header.on-dark .hamburger span{background:var(--parchment)}
  .mobile-nav{position:fixed;inset:0;z-index:60;background:rgba(27,46,35,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform:translateX(100%);visibility:hidden;transition:transform .4s cubic-bezier(.16,1,.3,1),visibility 0s linear .4s;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .mobile-nav.open{transform:translateX(0);visibility:visible;transition:transform .4s cubic-bezier(.16,1,.3,1),visibility 0s}
  .mobile-nav-inner{display:flex;flex-direction:column;gap:20px;text-align:center;padding:40px}
  .mobile-nav a{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:300;color:var(--parchment);text-decoration:none;letter-spacing:2px;text-transform:uppercase;padding:12px 0;min-height:44px;display:flex;align-items:center;justify-content:center}
  .mobile-nav a.book-link{color:var(--brass)}
  .mobile-nav .mobile-lang{display:flex;gap:18px;justify-content:center;margin-top:14px}
  .mobile-nav .mobile-lang a{font-size:13px;letter-spacing:3px;border:1px solid rgba(176,141,87,.55);border-radius:999px;padding:8px 20px;min-height:44px;color:var(--brass)}
  .mobile-nav-close{position:absolute;top:22px;right:5vw;width:44px;height:44px;background:none;border:none;color:var(--parchment);font-size:32px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
  @media (max-width:720px){
    header nav{display:none}
    .hamburger{display:flex}
  }
  @media (max-width:768px){
    body{font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}
    input,textarea,select{font-size:16px !important}
  }
  @supports (padding:max(0px)){
    header{padding-top:max(22px,env(safe-area-inset-top))}
    footer{padding-bottom:max(40px,env(safe-area-inset-bottom))}
    .mobile-nav{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  }
</style>
