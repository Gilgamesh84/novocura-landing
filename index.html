var EDITS=[["<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">","<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#2C4A3B\">"],["<\/style>","  /* ——— Faz 1 mobil: hamburger menü, 16px taban, güvenli alanlar, azaltılmış hareket ——— */\n  .hamburger{display:none;width:44px;height:44px;flex-direction:column;justify-content:center;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:10px;z-index:70;-webkit-tap-highlight-color:transparent}\n  .hamburger span{display:block;width:24px;height:2px;background:var(--ink);transition:transform .3s ease,opacity .3s ease,background .3s ease}\n  .hamburger[aria-expanded=\"true\"] span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}\n  .hamburger[aria-expanded=\"true\"] span:nth-child(2){opacity:0}\n  .hamburger[aria-expanded=\"true\"] span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}\n  header.on-dark .hamburger span{background:var(--parchment)}\n  .mobile-nav{position:fixed;inset:0;z-index:60;background:rgba(27,46,35,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform:translateX(100%);visibility:hidden;transition:transform .4s cubic-bezier(.16,1,.3,1),visibility 0s linear .4s;display:flex;flex-direction:column;justify-content:center;align-items:center}\n  .mobile-nav.open{transform:translateX(0);visibility:visible;transition:transform .4s cubic-bezier(.16,1,.3,1),visibility 0s}\n  .mobile-nav-inner{display:flex;flex-direction:column;gap:20px;text-align:center;padding:40px}\n  .mobile-nav a{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:300;color:var(--parchment);text-decoration:none;letter-spacing:2px;text-transform:uppercase;padding:12px 0;min-height:44px;display:flex;align-items:center;justify-content:center}\n  .mobile-nav a.book-link{color:var(--brass)}\n  .mobile-nav .mobile-lang{display:flex;gap:18px;justify-content:center;margin-top:14px}\n  .mobile-nav .mobile-lang a{font-size:13px;letter-spacing:3px;border:1px solid rgba(176,141,87,.55);border-radius:999px;padding:8px 20px;min-height:44px;color:var(--brass)}\n  .mobile-nav-close{position:absolute;top:22px;right:5vw;width:44px;height:44px;background:none;border:none;color:var(--parchment);font-size:32px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}\n  @media (max-width:720px){\n    header nav{display:none}\n    .hamburger{display:flex}\n  }\n  @media (max-width:768px){\n    body{font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}\n    input,textarea,select{font-size:16px !important}\n  }\n  @supports (padding:max(0px)){\n    header{padding-top:max(22px,env(safe-area-inset-top))}\n    footer{padding-bottom:max(40px,env(safe-area-inset-bottom))}\n    .mobile-nav{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}\n  }\n  @media (prefers-reduced-motion:reduce){\n    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}\n  }\n<\/style>"],["  <\/nav>\n<\/header>\n<section class=\"hero\" id=\"top\">","  <\/nav>\n  <button class=\"hamburger\" id=\"hamburgerBtn\" aria-label=\"Menüyü aç\" aria-expanded=\"false\" aria-controls=\"mobileNav\"><span><\/span><span><\/span><span><\/span><\/button>\n<\/header>\n<div class=\"mobile-nav\" id=\"mobileNav\" role=\"navigation\" aria-label=\"Mobil menü\" aria-hidden=\"true\">\n  <button class=\"mobile-nav-close\" id=\"mobileNavClose\" aria-label=\"Menüyü kapat\">&times;<\/button>\n  <div class=\"mobile-nav-inner\">\n    <a href=\"#about\">Hakkında<\/a>\n    <a href=\"randevu.html#seanslar\" data-page-link=\"randevu.html#seanslar\">Seanslar<\/a>\n    <a href=\"#teaching\">Eğitimler<\/a>\n    <a href=\"makaleler.html\" data-page-link=\"makaleler.html\">Makaleler<\/a>\n    <a class=\"book-link\" href=\"randevu.html\" data-page-link=\"randevu.html\">Randevu<\/a>\n    <div class=\"mobile-lang\"><a href=\"en.html\" data-lang-link=\"en.html\">EN<\/a><\/div>\n  <\/div>\n<\/div>\n<section class=\"hero\" id=\"top\">"],["\nstartAll();\n<\/script>","\n(function(){\n  var hamburger = document.getElementById('hamburgerBtn');\n  var mobileNav = document.getElementById('mobileNav');\n  var closeBtn = document.getElementById('mobileNavClose');\n  if (!hamburger || !mobileNav) return;\n  function openNav(){\n    mobileNav.classList.add('open');\n    mobileNav.setAttribute('aria-hidden','false');\n    hamburger.setAttribute('aria-expanded','true');\n    document.body.style.overflow = 'hidden';\n  }\n  function closeNav(){\n    mobileNav.classList.remove('open');\n    mobileNav.setAttribute('aria-hidden','true');\n    hamburger.setAttribute('aria-expanded','false');\n    document.body.style.overflow = '';\n  }\n  hamburger.addEventListener('click', function(){\n    if (mobileNav.classList.contains('open')) { closeNav(); } else { openNav(); }\n  });\n  if (closeBtn) closeBtn.addEventListener('click', closeNav);\n  mobileNav.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeNav); });\n  mobileNav.addEventListener('click', function(e){ if (e.target === mobileNav) closeNav(); });\n  document.addEventListener('keydown', function(e){\n    if (e.key === 'Escape' && mobileNav.classList.contains('open')) closeNav();\n  });\n})();\n(function(){var u=\"https://h.uguu.se/iEUkipvb.jpg\";var im=new Image();im.onload=function(){var p=document.getElementById(\"portraitImg\");if(p){p.src=u;}};im.src=u;})();\n(function(){var PRE=\"https://htmlpreview.github.io/?https://github.com/Gilgamesh84/novocura-landing/blob/main/\";document.addEventListener(\"click\",function(e){var t=e.target;while(t&&t.tagName!==\"A\")t=t.parentElement;if(!t)return;var h=t.getAttribute(\"href\");if(!h||h.charAt(0)===\"#\")return;if(!/^[a-z0-9-]+\\.html([#?].*)?$/i.test(h))return;if(location.host!==\"htmlpreview.github.io\")return;e.preventDefault();location.href=PRE+h;});if(location.hash){var el=document.querySelector(location.hash);if(el)setTimeout(function(){el.scrollIntoView();},80);}})();\nstartAll();\n<\/script>"],["    trigger: '#stageSection', start: 'top top', end: '+=4200',","    trigger: '#stageSection', start: 'top top', end: () => '+=' + (window.matchMedia('(max-width: 820px)').matches ? 2000 : 4200),"],["  if (window.matchMedia('(max-width: 720px)').matches) return;\n  initAnimations(); runAnimations();","  if (window.matchMedia('(max-width: 720px)').matches) return;\n  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  initAnimations(); runAnimations();"],[".entry{border-top:1px solid rgba(246,241,231,.22);padding:22px 0 20px;transition:border-color .35s ease}",".entry{border-top:1px solid rgba(246,241,231,.22);padding:23px 0;transition:border-color .35s ease}"],[".entry h3{color:var(--parchment);font-size:20px;line-height:1.35;margin-bottom:8px;font-weight:500}",".entry h3{color:var(--parchment);font-size:20px;line-height:1.35;margin-bottom:0;font-weight:500}"]];
fetch(SRC).then(function(r){return r.text()}).then(function(t){
  for (var i=0;i<EDITS.length;i++){
    if (t.split(EDITS[i][0]).length!==2){t=null;break}
    t=t.split(EDITS[i][0]).join(EDITS[i][1]);
  }
  if (t===null){document.body.innerHTML='<p style="font-family:sans-serif;padding:3em 1.5em;line-height:1.7">Sayfa yüklenirken bir sorun oluştu. Lütfen sayfayı yenileyin.</p>';return}
  document.open();document.write(t);document.close();
}).catch(function(){
  document.body.innerHTML='<p style="font-family:sans-serif;padding:3em 1.5em;line-height:1.7">Sayfa yüklenirken bir sorun oluştu. Lütfen sayfayı yenileyin.</p>';
});
</script>
